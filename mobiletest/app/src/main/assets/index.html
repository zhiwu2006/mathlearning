 '<section class="hero"><div class="eyebrow">今天的目标</div><h2>先看懂结构，再开始计算</h2><p>每道题只推进一个思考节点。答错时停在当前步骤，不会自动跳题。</p><button onclick="startSmart()">'+(last?'继续思路训练':'开始第一道训练')+'</button></section>'+
 '<div class="grid"><div class="card action" onclick="startRandom()"><div class="ico">🎲</div><h3>随机练习</h3><p>从当前测试题库随机选择</p></div><div class="card action" onclick="nav(\'library\')"><div class="ico">⌕</div><h3>题库浏览</h3><p>按结构与策略查看题目</p></div><div class="card action" onclick="special(\'固定总数+单位贡献\')"><div class="ico">⌘</div><h3>专项训练</h3><p>同结构、不同表面情境</p></div><div class="card action" onclick="nav(\'progress\')"><div class="ico">◒</div><h3>学习记录</h3><p>看清楚卡在哪个思考环节</p></div></div>'+
 '<div class="section-title"><h2>测试内容</h2><span>10 道 · 离线</span></div><div class="card"><div style="font-size:14px;line-height:1.8">✓ 题库浏览与筛选<br>✓ 分步 ReasoningGraph<br>✓ 错误不自动推进<br>✓ 分层提示与即时反馈<br>✓ 本地学习记录与结构掌握度</div><div class="smallnote">这是功能测试包，重点验证手机版交互，不代表题库内容已经全部导入。</div></div></div>'
}
function library(){
 const fams=["全部",...new Set(QUESTIONS.map(q=>q.family))];
 const qs=state.filter==="全部"?QUESTIONS:QUESTIONS.filter(q=>q.family===state.filter);
 return '<div class="page"><div class="filter">'+fams.map(f=>'<button class="chip '+(state.filter===f?'on':'')+'" onclick="setFilter(\''+esc(f)+'\')">'+esc(f)+'</button>').join('')+'</div><div class="list">'+qs.map((q,i)=>'<div class="qrow" onclick="start(\''+q.id+'\')"><div class="qmeta">'+esc(q.source)+' · '+esc(q.difficulty)+'</div><div class="qtitle">'+esc(q.title)+'</div><div class="tags"><span class="tag master">'+esc(q.family)+'</span><span class="tag">'+esc(q.strategy)+'</span><span class="tag">'+q.nodes.length+'步思路</span></div></div>').join('')+'</div></div>'
}
function practice(){
 return '<div class="page"><section class="hero"><div class="eyebrow">SMART PRACTICE</div><h2>测试版智能练习</h2><p>优先挑选尚未练习或掌握度较低的结构。正式版将接入 Family / Strategy / Reasoning Skill 三层 Mastery。</p><button onclick="startSmart()">开始一题</button></section><div class="section-title"><h2>当前规则</h2><span>v0.1</span></div><div class="card" style="font-size:14px;line-height:1.8">① 未练习题优先<br>② 较低掌握度结构优先<br>③ 连续重复同一题降权<br>④ 全程离线，不依赖AI生成题目</div></div>'
}
function progress(){
 const accuracy=store.totalNodes?Math.round(store.correctNodes/store.totalNodes*100):0;
 const mastery=Object.entries(store.mastery).sort((a,b)=>b[1]-a[1]);
 return '<div class="page"><div class="stats"><div class="stat"><b>'+store.attempts+'</b><span>开始题目</span></div><div class="stat"><b>'+store.completed+'</b><span>完成题目</span></div><div class="stat"><b>'+accuracy+'%</b><span>节点首次正确</span></div></div><div class="section-title"><h2>结构掌握度</h2><span>测试估计</span></div><div class="card">'+(mastery.length?mastery.map(([k,v])=>'<div class="barrow"><div class="lab"><span>'+esc(k)+'</span><b>'+Math.round(v)+'%</b></div><div class="bar"><i style="width:'+Math.max(4,v)+'%"></i></div></div>').join(''):'<div class="empty">完成几道题后，这里会出现结构掌握度。</div>')+'<div class="smallnote">当前只是 MVP 规则分数，不是经过统计校准的能力测量。</div></div></div>'
}
function start(id){state.current=QUESTIONS.find(q=>q.id===id);state.node=0;state.selected=null;state.hint=false;state.feedback=null;state.answers=[];state.page="tutor";store.attempts++;save();render()}
function startRandom(){start(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)].id)}
function startSmart(){
 const seen=new Set(store.history.map(x=>x.id));
 let pool=QUESTIONS.filter(q=>!seen.has(q.id)); if(!pool.length)pool=QUESTIONS;
 pool.sort((a,b)=>(store.mastery[a.family]||0)-(store.mastery[b.family]||0));
 start(pool[0].id);
}
function special(f){state.filter=f;nav("library")}
function setFilter(f){state.filter=f;render()}
function tutor(){
 const q=state.current,n=q.nodes[state.node],pct=Math.round(state.node/q.nodes.length*100);
 let input="";
 if(n.t==="choice") input='<div class="opts">'+n.o.map((o,i)=>'<button class="opt '+(state.selected===i?'sel':'')+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div>';
 if(n.t==="number") input='<div class="inputline"><input id="ans1" inputmode="decimal" placeholder="输入答案"></div>';
 if(n.t==="pair") input='<div class="inputline"><input id="ans1" inputmode="decimal" placeholder="'+esc(n.ph[0])+'"><input id="ans2" inputmode="decimal" placeholder="'+esc(n.ph[1])+'"></div>';
 return '<div class="page"><div class="tutor-head"><button class="back" onclick="quitTutor()">‹</button><div class="prog"><div class="progline"><i style="width:'+pct+'%"></i></div><div class="progtext">思考步骤 '+(state.node+1)+' / '+q.nodes.length+'</div></div></div>'+
 '<section class="problem"><div class="source">'+esc(q.source)+' · '+esc(q.family)+'</div><p>'+esc(q.title)+'</p></section>'+
 '<section class="mentor"><div class="mentor-label">AI 导师 · 当前只解决一步</div><h3>'+esc(n.q)+'</h3>'+input+
 (state.feedback?'<div class="feedback '+state.feedback.type+'">'+esc(state.feedback.text)+'</div>':'')+
 (state.hint?'<div class="hint">提示：'+esc(n.h)+'</div>':'')+
 '<button class="primary" onclick="submitNode()">'+(state.feedback&&state.feedback.type==="good"?'下一步':'确认这一步')+'</button>'+
 (!state.feedback||state.feedback.type!=="good"?'<button class="secondary" onclick="showHint()">给我一个提示</button>':'')+'</section></div>'
}
function pick(i){if(state.feedback?.type==="good")return;state.selected=i;render()}
function norm(v){return String(v??"").trim().replace(/\s+/g,"").replace(/，/g,",")}
function submitNode(){
 const q=state.current,n=q.nodes[state.node];
 if(state.feedback?.type==="good"){advance();return}
 let correct=false,response="";
 if(n.t==="choice"){if(state.selected===null){state.feedback={type:"bad",text:"先选择一个答案。"};render();return}response=state.selected;correct=state.selected===n.a}
 if(n.t==="number"){const el=document.getElementById("ans1");response=el?.value||"";if(!response.trim()){state.feedback={type:"bad",text:"先输入你的答案。"};render();return}correct=norm(response)===norm(n.a)}
 if(n.t==="pair"){const a=document.getElementById("ans1")?.value||"",b=document.getElementById("ans2")?.value||"";if(!a.trim()||!b.trim()){state.feedback={type:"bad",text:"两个空都需要填写。"};render();return}response=[a,b];correct=norm(a)===norm(n.a[0])&&norm(b)===norm(n.a[1])}
 store.totalNodes++;if(correct)store.correctNodes++;
 state.answers.push({node:state.node,correct,hint:state.hint,response});
 state.feedback={type:correct?"good":"bad",text:correct?n.why:"这一步还不对。"+(state.hint?" 再根据提示重新检查。":" 可以先看提示，再重新作答。")};
 if(!correct){state.selected=null} save();render()
}
function showHint(){state.hint=true;render()}
function advance(){if(state.node<state.current.nodes.length-1){state.node++;state.selected=null;state.hint=false;state.feedback=null;render()}else{finish()}}
function finish(){
 const q=state.current;const firstCorrect=state.answers.filter(a=>a.correct).length;const score=Math.round(firstCorrect/q.nodes.length*100);
 store.completed++;store.history.unshift({id:q.id,title:q.title,family:q.family,score,date:Date.now()});store.history=store.history.slice(0,30);
 const old=store.mastery[q.family]||35;store.mastery[q.family]=Math.max(0,Math.min(100,old*.7+score*.3));save();
 state.result={q,score};state.page="result";render()
}
function result(){
 const {q,score}=state.result;return '<div class="page result"><div class="score-ring" style="--pct:'+score+'%"><div class="score-inner">'+score+'</div></div><h2>本题思路完成</h2><p style="color:var(--sub);font-size:13px">重点不是只看最终答案，而是看每个推理节点是否能独立完成。</p><div class="card" style="text-align:left;margin-top:18px">'+q.skills.map((s,i)=>'<div class="skillrow"><span>'+esc(s)+'</span><b class="'+(score>=70||i===0?'ok':'weak')+'">'+(score>=70||i===0?'✓ 已练习':'△ 需巩固')+'</b></div>').join('')+'</div><button class="primary" onclick="startSmart()">再来一道</button><button class="secondary" onclick="nav(\'home\')">回首页</button></div>'
}
function quitTutor(){state.current=null;nav("home")}
function render(){
 document.getElementById("nav").style.display=(state.page==="tutor"||state.page==="result")?"none":"flex";
 document.getElementById("headerTitle").textContent=state.page==="library"?"题库":state.page==="progress"?"学习记录":state.page==="practice"?"智能练习":state.page==="tutor"?"思路训练":state.page==="result"?"本题结果":"奥数思路训练";
 let html=state.page==="home"?home():state.page==="library"?library():state.page==="practice"?practice():state.page==="progress"?progress():state.page==="tutor"?tutor():result();
 document.getElementById("root").innerHTML=html;
}
render();
</script>
</body>
</html>
