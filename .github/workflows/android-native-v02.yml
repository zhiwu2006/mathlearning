name: Android Native v0.2 APK

on:
  push:
    branches:
      - chatgpt/android-native-v0.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Expand native project
        run: |
          unzip -q androidnative-src.zip
          test -f androidnative/app/build.gradle

      - name: Build native debug APK
        working-directory: androidnative
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="androidnative/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "$SHA  OlympiadTutor-Native-v0.2-debug.apk" > APK_SHA256.txt
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "APK SHA256: $SHA"

      - name: Prepare package
        run: |
          mkdir -p dist
          cp androidnative/app/build/outputs/apk/debug/app-debug.apk dist/OlympiadTutor-Native-v0.2-debug.apk
          cp androidnative/app/src/main/assets/starter.olympiadpack dist/Olympiad-Starter-v0.2.olympiadpack
          cp androidnative-src.zip dist/OlympiadTutor-Native-v0.2-source.zip
          cp APK_SHA256.txt dist/APK_SHA256.txt
          cat > dist/README.txt <<'EOF'
          奥数思路训练 Native v0.2
          =========================
          - Kotlin + Jetpack Compose + Room
          - 题库管理支持导入 .olympiadpack
          - Starter Pack 51 道：10 道 Tutor Ready + 41 道 Structured
          - Debug 签名，仅用于测试
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlympiadTutor-Native-v0.2-test
          path: dist/*
          retention-days: 30
