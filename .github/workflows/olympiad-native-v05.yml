name: Olympiad Tutor Native v0.5 APK

on:
  push:
    branches:
      - chatgpt/olympiad-native-v0.5
    paths:
      - "native-v05/**"
      - ".github/workflows/olympiad-native-v05.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          rm -rf native-v05/project
          mkdir -p native-v05/project
          unzip -q native-v05/source.zip -d native-v05/project
          echo "=== project files ==="
          find native-v05/project -maxdepth 4 -type f | sort | head -100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Patch test version metadata
        shell: bash
        run: |
          BUILD="native-v05/project/app/build.gradle"
          if [ -f "$BUILD" ]; then
            sed -i 's/versionCode [0-9][0-9]*/versionCode 6/' "$BUILD" || true
            sed -i 's/versionName "[^"]*"/versionName "0.5.1-tutor50-test"/' "$BUILD" || true
          fi

      - name: Build native debug APK
        working-directory: native-v05/project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="native-v05/project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/OlympiadTutor-Native-v0.5.1-debug.apk
          sha256sum dist/OlympiadTutor-Native-v0.5.1-debug.apk > dist/APK_SHA256.txt
          cat > dist/INSTALL.txt <<'EOF'
          奥数思路训练 Android 原生测试版 v0.5.1
          ======================================
          1. 安装 OlympiadTutor-Native-v0.5.1-debug.apk。
          2. 这是 debug 签名内部测试包。
          3. 进入“题库管理”后可导入 TwoBooks-All-548-Tutor50-VisualP1-v0.5.1.olympiadpack。
          4. 完整题库：548 道唯一题；50 道 Tutor Ready；94 道 Gold；404 道 Structured。
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlympiadTutor-Native-v0.5.1-test
          path: dist/*
          retention-days: 30
