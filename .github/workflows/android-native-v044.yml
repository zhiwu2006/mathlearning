name: Olympiad Tutor Native v0.4.4 APK

on:
  push:
    branches:
      - chatgpt/olympiad-apk-v0.4.4
    paths:
      - "ci043/**"
      - ".github/workflows/android-native-v044.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          mkdir -p /tmp/olympiad-src
          cat ci043/chunk_00.txt ci043/chunk_01.txt ci043/chunk_02.txt ci043/chunk_03.txt | tr -d '\n\r' | base64 -d > /tmp/native-ci-source.zip
          unzip -t /tmp/native-ci-source.zip
          unzip -q /tmp/native-ci-source.zip -d /tmp/olympiad-src
          test -f /tmp/olympiad-src/settings.gradle
          test -f /tmp/olympiad-src/app/build.gradle

      - name: Apply v0.4.4 detail-page fix
        shell: bash
        run: |
          cd /tmp/olympiad-src
          patch -p1 < "$GITHUB_WORKSPACE/ci043/detailfix_v044.patch"
          grep -n "versionName" app/build.gradle
          grep -n "Detail UI Fix" app/src/main/java/com/zhiwu/olympiadtutor/ui/OlympiadApp.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: /tmp/olympiad-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="/tmp/olympiad-src/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p dist
          cp "$APK" dist/OlympiadTutor-Native-v0.4.4-detailfix-debug.apk
          sha256sum dist/OlympiadTutor-Native-v0.4.4-detailfix-debug.apk | tee dist/APK_SHA256.txt
          cat > dist/INSTALL.txt <<'EOF'
          奥数思路训练 Native v0.4.4 - 详情页修正版
          ==========================================
          修复：
          1. 题目详情页“质量状态”改为中文状态卡，不再直接显示内部枚举码。
          2. Structured 题明确显示“待结构化”，避免误以为数据缺失。
          3. 来源解析恢复“分析/解/评注/小题编号/原书插图”等段落边界并增加行距。
          4. 题库内容仍使用 v0.4.3 Tutor50 包，无需重新生成题库。
          
          注意：如果旧 debug APK 与本 APK 的测试签名不同，Android 可能要求先卸载旧版再安装。
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OlympiadTutor-Native-v0.4.4-detailfix
          path: dist/*
          retention-days: 30
